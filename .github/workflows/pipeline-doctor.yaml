name: Pipeline Doctor

on:
  workflow_dispatch:

jobs:
  analyze-pipeline:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Configure Docker user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Start Pipeline Doctor API
        run: |
          docker compose up -d --build

      - name: Show container status
        run: |
          docker compose ps

      - name: Wait for API health
        run: |
          for i in {1..30}
          do
            if curl --fail http://localhost:8080/health
            then
              echo "Pipeline Doctor API is healthy"
              exit 0
            fi

            echo "Waiting for Pipeline Doctor API..."
            sleep 2
          done

          echo "Pipeline Doctor API did not become healthy"
          docker compose logs
          exit 1

      - name: Send pipeline event
        run: |
          curl --fail --silent \
            -X POST \
            http://localhost:8080/analyze \
            -H "Content-Type: application/json" \
            --data @pipeline_event.json \
            --output output/api_response.json

      - name: Show API response
        run: |
          python3 -m json.tool output/api_response.json

      - name: Show saved analysis report
        run: |
          python3 -m json.tool output/pipeline_analysis.json

      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-analysis
          path: |
            output/api_response.json
            output/pipeline_analysis.json

      - name: Stop services
        if: always()
        run: |
          docker compose logs
          docker compose down