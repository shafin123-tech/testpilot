services:
  pipeline-doctor:
    build: .
    image: pipeline-doctor:1.0

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PIPELINE_URL: "http://host.docker.internal:8000/pipeline_event.json"
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      MODEL: "qwen2.5-coder:7b"
      OUTPUT_FILE: "/output/pipeline_analysis.json"

    volumes:
      - "./output:/output"